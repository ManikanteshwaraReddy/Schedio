<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Artificial Intelligence illustration</title>
  <desc id="desc">A stylized AI chip connected to neural nodes on a gradient background.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="45%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)"/>
  <circle cx="160" cy="170" r="170" fill="#22d3ee" opacity="0.1"/>
  <circle cx="980" cy="620" r="220" fill="#818cf8" opacity="0.14"/>

  <rect x="350" y="150" width="500" height="500" rx="40" fill="#0f172a" stroke="#475569" stroke-width="2"/>
  <rect x="470" y="270" width="260" height="260" rx="28" fill="url(#chip)"/>
  <rect x="530" y="330" width="140" height="140" rx="18" fill="#0b1225" opacity="0.45"/>

  <g stroke="#67e8f9" stroke-width="6" stroke-linecap="round">
    <line x1="470" y1="300" x2="410" y2="260"/>
    <line x1="470" y1="500" x2="400" y2="540"/>
    <line x1="730" y1="300" x2="790" y2="260"/>
    <line x1="730" y1="500" x2="800" y2="540"/>
    <line x1="600" y1="270" x2="600" y2="200"/>
    <line x1="600" y1="530" x2="600" y2="600"/>
  </g>

  <g fill="#22d3ee">
    <circle cx="410" cy="260" r="12"/>
    <circle cx="400" cy="540" r="12"/>
    <circle cx="790" cy="260" r="12"/>
    <circle cx="800" cy="540" r="12"/>
    <circle cx="600" cy="200" r="12"/>
    <circle cx="600" cy="600" r="12"/>
  </g>

  <g fill="#c4b5fd" opacity="0.85">
    <circle cx="300" cy="220" r="7"/>
    <circle cx="920" cy="220" r="7"/>
    <circle cx="280" cy="580" r="7"/>
    <circle cx="940" cy="580" r="7"/>
  </g>
</svg>
