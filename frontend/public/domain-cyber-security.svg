<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Cyber security illustration</title>
  <desc id="desc">A glowing shield, lock icon, and network lines representing cybersecurity.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0b3b3f"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#67e8f9"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)"/>
  <circle cx="200" cy="140" r="170" fill="#22d3ee" opacity="0.08"/>
  <circle cx="980" cy="650" r="220" fill="#2dd4bf" opacity="0.09"/>

  <g opacity="0.35" stroke="url(#line)" stroke-width="2">
    <path d="M120 220 C240 160, 340 260, 460 210" fill="none"/>
    <path d="M740 180 C880 110, 980 240, 1100 180" fill="none"/>
    <path d="M90 560 C290 480, 390 660, 620 580" fill="none"/>
    <path d="M680 520 C840 460, 1000 620, 1140 540" fill="none"/>
  </g>

  <g fill="#67e8f9" opacity="0.9">
    <circle cx="460" cy="210" r="8"/>
    <circle cx="740" cy="180" r="8"/>
    <circle cx="620" cy="580" r="8"/>
    <circle cx="680" cy="520" r="8"/>
    <circle cx="1100" cy="180" r="8"/>
    <circle cx="1140" cy="540" r="8"/>
  </g>

  <rect x="320" y="130" width="560" height="540" rx="34" fill="#0b1220" opacity="0.8"/>

  <path d="M600 210 L760 270 V390 C760 505 686 590 600 625 C514 590 440 505 440 390 V270 L600 210 Z"
        fill="url(#shield)" filter="url(#glow)"/>
  <path d="M600 245 L720 290 V388 C720 476 666 545 600 576 C534 545 480 476 480 388 V290 L600 245 Z"
        fill="#083344" opacity="0.5"/>

  <rect x="540" y="350" width="120" height="120" rx="18" fill="#022c33" stroke="#67e8f9" stroke-width="6"/>
  <path d="M560 350 V320 C560 290 578 270 600 270 C622 270 640 290 640 320 V350"
        fill="none" stroke="#67e8f9" stroke-width="12" stroke-linecap="round"/>
  <circle cx="600" cy="400" r="12" fill="#67e8f9"/>
  <rect x="594" y="410" width="12" height="30" rx="6" fill="#67e8f9"/>

  <g opacity="0.7" stroke="#67e8f9" stroke-width="3" fill="none">
    <path d="M520 510 L460 565"/>
    <path d="M680 510 L740 565"/>
    <path d="M600 530 L600 610"/>
  </g>
  <g fill="#67e8f9" opacity="0.85">
    <circle cx="460" cy="565" r="10"/>
    <circle cx="740" cy="565" r="10"/>
    <circle cx="600" cy="610" r="10"/>
  </g>
</svg>
