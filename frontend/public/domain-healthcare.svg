<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Healthcare illustration</title>
  <desc id="desc">Medical cross, heartbeat line, and cards symbolizing healthcare technology.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="50%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#bfdbfe"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="heart" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)"/>
  <circle cx="170" cy="120" r="170" fill="#93c5fd" opacity="0.35"/>
  <circle cx="1030" cy="690" r="210" fill="#60a5fa" opacity="0.25"/>

  <rect x="180" y="130" width="840" height="540" rx="30" fill="url(#panel)"/>
  <rect x="230" y="190" width="740" height="420" rx="22" fill="#f8fafc"/>

  <rect x="290" y="250" width="280" height="300" rx="18" fill="#e2e8f0"/>
  <rect x="650" y="250" width="260" height="120" rx="18" fill="#e2e8f0"/>
  <rect x="650" y="390" width="260" height="160" rx="18" fill="#e2e8f0"/>

  <rect x="355" y="305" width="150" height="28" rx="10" fill="#2563eb"/>
  <rect x="415" y="245" width="30" height="150" rx="10" fill="#2563eb"/>

  <path d="M675 455 H715 L740 418 L770 500 L795 445 L820 455 H885"
        fill="none" stroke="url(#heart)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

  <circle cx="705" cy="300" r="16" fill="#38bdf8"/>
  <rect x="735" y="288" width="150" height="24" rx="12" fill="#93c5fd"/>

  <circle cx="705" cy="525" r="16" fill="#60a5fa"/>
  <rect x="735" y="513" width="130" height="24" rx="12" fill="#93c5fd"/>
</svg>
