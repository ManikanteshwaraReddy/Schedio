name: Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          PUBLIC_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          REACT_APP_BACKEND_URL: ${{ secrets.REACT_APP_BACKEND_URL }}
        run: npm run build

      - name: Detect build output dir
        id: outdir
        run: |
          if [ -f frontend/build/index.html ]; then
            echo "dir=build" >> "$GITHUB_OUTPUT"
          elif [ -f frontend/dist/index.html ]; then
            echo "dir=dist" >> "$GITHUB_OUTPUT"
          else
            echo "No build output found in frontend/build or frontend/dist"
            ls -la frontend
            exit 1
          fi

      - name: Show selected output directory
        run: ls -la frontend/${{ steps.outdir.outputs.dir }}

      - name: Add SPA fallback for GitHub Pages
        run: cp frontend/${{ steps.outdir.outputs.dir }}/index.html frontend/${{ steps.outdir.outputs.dir }}/404.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./frontend/${{ steps.outdir.outputs.dir }}
          force_orphan: true
          enable_jekyll: false
